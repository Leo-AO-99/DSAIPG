[sortbenchmark]
version = 1.0.1 (sortbenchmark)

[helper]
instrument = true
seed = 1228
cutoff =

[instrumenting]
# The options in this section apply only if instrument (in [helper]) is set to true.
# This slows everything down a lot so keep this small (or zero)
inversions = 0
swaps = true
compares = true
copies = true
fixes = false
hits = true
lookups = false

[benchmarkstringsorters]
mergesort = true
timsort = false
quicksort = true
introsort = false
insertionsort = false
quicksort3way = false
heapsort = true

[benchmarkdatesorters]
timsort = false

[mergesort]
insurance = false
nocopy = true

[heapsort]
